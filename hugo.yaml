baseurl: https://ranch007.github.io
locale: zh
theme: hugo-theme-stack
title:
copyright: Ranch's Blog

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh, zh-hant-hk, zh-hant-tw
DefaultContentLanguage: zh

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: true

languages:
  zh:
    label: 简体中文
    title: Ranch's Blog
    weight: 1

services:
  # Change it to your Disqus shortname before using
  disqus:
    shortname: "hugo-theme-stack"
  # GA Tracking ID
  googleAnalytics:
    id:

pagination:
  pagerSize: 6

permalinks:
  post: /p/:slug/
  page: /:slug/

params:
  mainSections:
    - post
  rssFullContent: true
  favicon: img/favicon.ico
  # favicon 现从 assets 目录读取，例如 assets/img/favicon.ico -> img/favicon.ico（不要加前导 /）

  footer:
    since: 2024
    customText: 🤝本博客仅用于记录个人学习和成长。所有内容仅为个人观点，不代表任何团体或组织的立场。如有疑问，欢迎联系！

  dateFormat:
    published: 2006-01-02
    lastUpdated: 2006-01-02 15:04

  sidebar:
    compact: false
    emoji:
    subtitle1: 知是行之始
    subtitle2: 行是知之成

    avatar: https://github.com/Ranch007.png

  article:
    math: false
    toc: true
    readingTime: true
    license:
      enabled: true
      default: 根据CC BY-NC-SA 4.0协议授权，转载请在留言板告知🔔

  comments:
    enabled: true
    provider: giscus

    giscus:
      repo: Ranch007/Message-Boards
      repoID: R_kgDOU2NFUQ
      category: Announcements
      categoryID: DIC_kwDOU2NFUc4DGyIT
      mapping: pathname
      strict: 0
      lightTheme: light
      darkTheme: dark_dimmed
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: top
      lang: zh-CN
      loading: lazy

  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 10
    page:
      - type: toc

  opengraph:
    twitter:
      # Your Twitter username
      site:

      # Available values: summary, summary_large_image
      card: summary_large_image

  colorScheme:
    # Display toggle
    toggle: true

    # Available values: auto, light, dark
    default: auto

  imageProcessing:
    thumbnail:
      enabled: true
    content:
      enabled: false

### Custom menu
### See https://stack.jimmycai.com/config/menu
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:
  main: []

  social:
    - identifier: github
      name: Ranch's GitHub
      url: https://github.com/Ranch007/Ranch007.github.io
      weight: 1
      params:
        icon: brand-github

    - identifier: email
      name: Email
      url: mailto:Ranch@ranch007.top
      weight: 2
      params:
        icon: email

    - identifier: rss
      name: RSS
      url: /index.xml
      weight: 3
      params:
        icon: rss

related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100

    - name: categories
      weight: 200

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
    renderer:
      ## Set to true if you have HTML content inside Markdown
      unsafe: true
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4

frontmatter:
  lastmod:
    - :git
    - lastmod
    - :fileModTime

enableGitInfo: true
